<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Député Signal</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #f0f0f0;
    padding: 20px 16px 40px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 2px;
  }
  .subtitle {
    color: #9a9a9a;
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #b0b0b0;
    margin-bottom: 6px;
  }
  select, input, button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #2a2d34;
    background: #1a1d24;
    color: #f0f0f0;
    font-size: 16px;
    margin-bottom: 16px;
  }
  button {
    background: #2563eb;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
  }
  button.secondary {
    background: #1a1d24;
    border: 1px solid #2a2d34;
    font-weight: 400;
    font-size: 13px;
    padding: 10px;
  }
  .card {
    border-radius: 14px;
    padding: 20px;
    margin-top: 8px;
    border: 1px solid #2a2d34;
  }
  .signal-title {
    font-size: 26px;
    font-weight: 700;
    margin: 4px 0;
  }
  .score {
    color: #9a9a9a;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 14px;
    border-top: 1px solid #23262d;
  }
  .row span:first-child { color: #9a9a9a; }
  .error {
    color: #f87171;
    font-size: 14px;
    margin-top: 10px;
  }
  .disclaimer {
    color: #7a7a7a;
    font-size: 12px;
    margin-top: 28px;
    line-height: 1.5;
  }
  .settings {
    margin-top: 30px;
    border-top: 1px solid #23262d;
    padding-top: 16px;
  }
  .settings summary {
    color: #9a9a9a;
    font-size: 13px;
    cursor: pointer;
  }
  .call { color: #4ade80; }
  .put { color: #f87171; }
  .wait { color: #9a9a9a; }
  .call-bg { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.3); }
  .put-bg { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.3); }
  .wait-bg { background: rgba(154,154,154,0.08); }
  .stats-bar {
    display: flex;
    justify-content: space-between;
    background: #1a1d24;
    border: 1px solid #2a2d34;
    border-radius: 10px;
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 13px;
  }
  .stats-bar b { font-size: 16px; }
  .hist-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid #23262d;
    font-size: 13px;
    gap: 8px;
  }
  .hist-left { color: #b0b0b0; }
  .hist-badges button {
    width: auto;
    padding: 5px 9px;
    font-size: 12px;
    margin: 0 0 0 4px;
    border-radius: 6px;
  }
  .badge-win { background: rgba(74,222,128,0.15); color: #4ade80; border-color: rgba(74,222,128,0.3); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  .badge-loss { background: rgba(248,113,113,0.15); color: #f87171; border-color: rgba(248,113,113,0.3); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  .badge-neutral { background: rgba(154,154,154,0.15); color: #9a9a9a; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>

  <h1>📊 Député Signal</h1>
  <div class="subtitle">Analyse technique — EMA · RSI · MACD</div>

  <label for="asset">Paire</label>
  <select id="asset"></select>

  <button id="btnSignal">Obtenir le signal</button>

  <label style="display:flex; align-items:center; gap:10px; cursor:pointer; margin-top:-4px;">
    <input type="checkbox" id="autoRefresh" style="width:auto; margin:0;">
    <span style="font-size:13px; color:#b0b0b0;">Rafraîchir automatiquement toutes les 30s</span>
  </label>

  <div id="result"></div>

  <div id="statsBar"></div>
